services:

  mpira-api:
    build:
      context: ./mpira-api
    container_name: mpira-api
    ports:
      - "8000:80"
    volumes:
      - ./mpira-api:/var/www/html
    depends_on:
      - mysql


  mpira-app:
    build:
      context: ./mpira-app
    container_name: mpira-app
    ports:
      - "5173:5173"
    volumes:
      - ./mpira-app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - mpira-api


  mysql:
    image: mysql:8.4
    container_name: mpira-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mpira
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mpira-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql


volumes:

  mysql-data: